services:
  fntv-record-view:
    container_name: fntv-record-view
    build: .
    image: fntv-record-view:local
    ports:
      - "5000:5000"
    volumes:
      # 只读挂载外部数据库目录到容器内的database目录
      - /usr/local/apps/@appdata/trim.media/database:/app/database:ro
      # 挂已经存在的目录。只在 trim_media.sock 真是 socket 时才连接，
      # 不把 socket 文件本身写进挂载，避免它不存在时被 Docker 建成目录。
      - /var/run:/host/run
      - /usr/local/apps:/host/apps:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - FLASK_ENV=production
      - PYTHONPATH=/app
      - TZ=Asia/Shanghai # 设置时区
      - TRIM_MEDIA_URL=http://host.docker.internal:5666
    restart: unless-stopped
    network_mode: bridge
    deploy:
      resources:
        limits:
          memory: 100M
          cpus: '0.5'
        reservations:
          memory: 10M
          cpus: '0.1'