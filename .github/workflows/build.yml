name: Build image and fpk

on:
  push:
    branches:
      - main
      - master
      - release
      - develop
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: |
          repo="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "repository=ghcr.io/${repo}" >> "$GITHUB_OUTPUT"
          echo "ref=ghcr.io/${repo}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.repository }}:latest
            ${{ steps.image.outputs.ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make GHCR package public
        continue-on-error: true
        run: |
          name="$(echo "${GITHUB_REPOSITORY}" | cut -d/ -f2 | tr '[:upper:]' '[:lower:]')"
          curl --fail --silent --show-error -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/${name}/visibility" \
            -d '{"visibility":"public"}'

      - name: Install fnpack
        run: |
          curl --fail --location --silent --show-error \
            -o /tmp/fnpack \
            https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          chmod +x /tmp/fnpack

      - name: Build fpk
        run: |
          sed -i "s|__FNTV_IMAGE__|${{ steps.image.outputs.ref }}|" fpk/app/docker/docker-compose.yaml
          chmod +x fpk/cmd/*
          /tmp/fnpack build --directory fpk
          test -f fntv-record-view.fpk

      - name: Upload fpk artifact
        uses: actions/upload-artifact@v4
        with:
          name: fntv-record-view.fpk
          path: fntv-record-view.fpk
          if-no-files-found: error

      - name: Publish fpk to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(grep '^version=' fpk/manifest | cut -d= -f2 | tr -d '[:space:]')"
          tag="v${version}"
          notes="本次构建来自提交 ${GITHUB_SHA}。在应用中心手动安装 fntv-record-view.fpk。容器镜像需为公开：https://github.com/${GITHUB_REPOSITORY}/pkgs/container/${GITHUB_REPOSITORY#*/}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" --latest --notes "$notes"
            gh release upload "$tag" fntv-record-view.fpk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" fntv-record-view.fpk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" --latest --notes "$notes"
          fi
