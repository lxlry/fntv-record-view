name: Build image and fpk

on:
  push:
    branches:
      - main
      - master
      - release
      - develop
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: |
          name="$(echo "${{ github.repository }}" | cut -d/ -f2 | tr '[:upper:]' '[:lower:]')"
          owner="$(echo "${{ secrets.DOCKER_USERNAME }}" | tr '[:upper:]' '[:lower:]')"
          if [ -z "$owner" ]; then
            echo "缺少仓库密钥 DOCKER_USERNAME" >&2
            exit 1
          fi
          echo "repository=${owner}/${name}" >> "$GITHUB_OUTPUT"
          echo "ref=${owner}/${name}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.repository }}:latest
            ${{ steps.image.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install fnpack
        run: |
          curl --fail --location --silent --show-error \
            -o /tmp/fnpack \
            https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          chmod +x /tmp/fnpack

      - name: Build fpk
        run: |
          sed -i "s|__FNTV_IMAGE__|${{ steps.image.outputs.ref }}|" fpk/app/docker/docker-compose.yaml
          chmod +x fpk/cmd/*
          /tmp/fnpack build --directory fpk
          test -f fntv-record-view.fpk

      - name: Upload fpk artifact
        uses: actions/upload-artifact@v4
        with:
          name: fntv-record-view.fpk
          path: fntv-record-view.fpk
          if-no-files-found: error

      - name: Attach fpk to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: fntv-record-view.fpk
